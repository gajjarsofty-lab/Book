<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group 6 War Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky command bar (modes + timer) over a single reading column; LIVE pins the five-link chain under the bar. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#16201D; --ink-2:#4B5955; --line:#CFD8D5;
  --accent:#1D4D6A; --accent-ink:#FFFFFF; --accent-soft:#DCE8EF;
  --them:#963820; --them-bg:#F6E7E1;
  --us:#1B5868; --us-bg:#DFEEF1;
  --fact:#4A5B1C; --fact-bg:#ECF0DC;
  --question:#46398A; --question-bg:#EAE7F6;
  --warn:#875700; --warn-bg:#FAEFD6;
  --danger:#B42318; --danger-bg:#FBE4E1;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --font-label:"IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E5ECEA; --ink-2:#A5B3AF; --line:#2E3B39;
    --accent:#86B8D4; --accent-ink:#0B1820; --accent-soft:#1A3140;
    --them:#E8927A; --them-bg:#3A231C; --us:#80C6D6; --us-bg:#15313A; --fact:#BCCD8A; --fact-bg:#272F14;
    --question:#B8AEF2; --question-bg:#29244A; --warn:#E9B958; --warn-bg:#3A2D10; --danger:#FF8C80; --danger-bg:#401C18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E5ECEA; --ink-2:#A5B3AF; --line:#2E3B39;
  --accent:#86B8D4; --accent-ink:#0B1820; --accent-soft:#1A3140;
  --them:#E8927A; --them-bg:#3A231C; --us:#80C6D6; --us-bg:#15313A; --fact:#BCCD8A; --fact-bg:#272F14;
  --question:#B8AEF2; --question-bg:#29244A; --warn:#E9B958; --warn-bg:#3A2D10; --danger:#FF8C80; --danger-bg:#401C18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-label);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.label{font-family:var(--font-label);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.prose{max-width:68ch}

/* Command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.brand{font-family:var(--font-label);font-weight:700;letter-spacing:.04em;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px}
.brand span{color:var(--accent)}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-family:var(--font-label);font-weight:600;letter-spacing:.06em;font-size:13px}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;font-family:var(--font-label);font-weight:600;letter-spacing:.03em;background:var(--surface-2);cursor:pointer}
.timer-pill{font-family:var(--font-mono);font-weight:600;font-size:15px;padding:4px 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface-2);cursor:pointer;min-width:74px;text-align:center}
.timer-pill.warn,.timer-big.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.timer-pill.crit,.timer-big.crit{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

main{padding-block:22px 64px}
.section{display:flex;flex-direction:column;gap:12px;padding-block:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid > *{min-width:0}

/* Semantic blocks */
.tag{display:inline-block;font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.t-them{background:var(--them-bg);color:var(--them)}
.t-us{background:var(--us-bg);color:var(--us)}
.t-fact{background:var(--fact-bg);color:var(--fact)}
.t-q{background:var(--question-bg);color:var(--question)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-neutral{background:var(--surface-2);color:var(--ink-2)}
.blk{border-left:3px solid var(--line);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:4px}
.blk.them{border-color:var(--them)} .blk.us{border-color:var(--us)} .blk.fact{border-color:var(--fact)} .blk.q{border-color:var(--question)} .blk.warn{border-color:var(--warn)}
.say{font-size:16px}
.say::before{content:"“"} .say::after{content:"”"}

/* Home */
.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.motion{font-size:clamp(18px,2.4vw,22px);font-weight:500;line-height:1.4}
.position{font-family:var(--font-label);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--us)}
.chain{display:flex;flex-direction:column;gap:0;counter-reset:link}
.chain .start{font-family:var(--font-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--them);padding:8px 12px;border:1px dashed var(--them);border-radius:var(--radius);background:var(--them-bg)}
.chain .link{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.chain .link:hover{border-color:var(--accent)}
.chain .arrow{height:14px;margin-left:22px;border-left:2px solid var(--line)}
.chain .key{font-family:var(--font-label);font-weight:700;letter-spacing:.08em;font-size:13px;min-width:116px}
.chain .who{font-family:var(--font-mono);font-size:12.5px;color:var(--accent)}
.roles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.role{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;cursor:pointer}
.role:hover{border-color:var(--accent)}
.role b{font-family:var(--font-label);font-size:16px;letter-spacing:.04em}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modecards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.modecard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.modecard:hover{border-color:var(--accent)}
.modecard b{font-family:var(--font-label);font-size:18px;letter-spacing:.08em}

/* Tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:1px solid transparent;background:none;padding:6px 10px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.persona{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px}

/* Disclosure */
.disc-btns{display:flex;flex-wrap:wrap;gap:6px}
.disc-btns .btn{font-size:12.5px;padding:4px 10px;font-family:var(--font-label);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.reveal{display:flex;flex-direction:column;gap:8px}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-label);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* Strategic questions */
.qcard{display:flex;flex-direction:column;gap:10px}
.branch{display:flex;gap:6px;flex-wrap:wrap}
.branch .btn{min-width:110px;font-family:var(--font-label);font-weight:700;letter-spacing:.06em}

/* LIVE */
.chainbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,52px));z-index:15;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.chainbar .links{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.chainbar .links{grid-template-columns:repeat(3,minmax(0,1fr))}}
.clink{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.clink b{font-family:var(--font-label);font-weight:700;letter-spacing:.07em;font-size:13.5px}
.clink span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.clink[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clink[aria-pressed="true"] span{color:var(--accent-ink)}
.topics{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 8px;cursor:pointer;font-family:var(--font-label);font-weight:700;letter-spacing:.06em;font-size:14.5px;text-transform:uppercase}
.topic:hover{border-color:var(--them)}
.topic[aria-pressed="true"]{background:var(--them-bg);border-color:var(--them);color:var(--them)}
.livepanel{display:grid;gap:10px}
.timer-big{font-family:var(--font-mono);font-weight:600;font-size:clamp(44px,9vw,72px);text-align:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:6px 0;font-variant-numeric:tabular-nums}
.notes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);padding:6px 8px;font:inherit;font-size:13.5px}
.note label{font-family:var(--font-label);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}

/* Emergency overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .wrap{padding-block:18px 48px}
.emerg h2{color:var(--danger)}
.emerg .big{font-size:19px;line-height:1.45}
ol.tight,ul.tight{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.score input[type=range]{width:100%}
.transcript .turn{display:grid;grid-template-columns:90px 1fr;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.transcript .turn:last-child{border-bottom:0}
.transcript .who{font-family:var(--font-mono);font-size:12.5px;font-weight:600}
.who.g6{color:var(--us)} .who.g5{color:var(--them)} .who.jd{color:var(--question)}
@media (max-width:520px){.transcript .turn{grid-template-columns:1fr;gap:2px}}
details summary{cursor:pointer;font-weight:600}
.livegrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){.livegrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="wrap">
    <button class="brand" id="homeBtn" type="button">GROUP 6 <span>· WAR ROOM</span></button>
    <nav class="modes" aria-label="Mode">
      <button class="mode" type="button" data-mode="learn">LEARN</button>
      <button class="mode" type="button" data-mode="practise">PRACTISE</button>
      <button class="mode" type="button" data-mode="live">LIVE</button>
    </nav>
    <div class="bar-right">
      <button class="chip" id="roleChip" type="button" title="Change role">TEAM VIEW</button>
      <button class="timer-pill js-timer" id="timerPill" type="button" title="Start / pause timer">5:00</button>
      <button class="btn danger" id="emergBtn" type="button">EMERGENCY</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="overlay" id="emergency" hidden></div>

<script>
"use strict";
/* ============================================================
   CONFIG: edit timings and speaking allocation here.
   All times in seconds. Allocation stays provisional until
   the competition rules and judging rubric are confirmed.
   ============================================================ */
const CONFIG = {
  rounds: { opening: 300, rebuttal: 120, final: 120 },
  buffer: { opening: 25, rebuttal: 10, final: 10 },
  presets: [300, 180, 120, 60, 30],
  warnAt: 30,
  criticalAt: 10,
  defaultStructure: "A"
};

const STRUCTURES = {
  A: { name: "A · All five speak every round",
       note: "Everyone opens, rebuts and closes. Order rotates so nobody is always first or last. Handoff: “[Name] on [link].” No thank-yous, no recaps.",
       rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P3","P4","P5","P1","P2"], final: ["P1","P2","P3","P4","P5"] } },
  B1: { name: "B1 · One speaker per round",
        note: "Equal speaking time is impossible with three slots and five people. P2 and P4 own cross-examination or points of information if the format has them; otherwise they write the live rebuttal brief. Raise this with staff.",
        rounds: { opening: ["P1"], rebuttal: ["P3"], final: ["P5"] } },
  B2: { name: "B2 · All open, two or three in later rounds",
        note: "Questioning, if it exists, goes to P1 and P5 so time evens out. Rotate the closer if there are several debates.",
        rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P2","P3","P4"], final: ["P5","P1"] } },
  B3: { name: "B3 · Cross-examination round exists",
        note: "As B2, plus each speaker asks their primary strategic question once. Whoever did not speak in rebuttal leads cross-examination.",
        rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P2","P3","P4"], final: ["P5","P1"], cross: ["P1","P5","P2","P3","P4"] } }
};

/* ============================================================
   CONTENT
   ============================================================ */
const MOTION = "Should online platforms be held legally liable for user-posted misinformation?";
const POSITION_SHORT = "NO BROAD LIABILITY FOR USER SPEECH";
const POSITION = "A platform shouldn't be legally liable just because a user posted something false — not automatically, and not because someone flagged it or a jury later decides it should have caught it. Platforms should answer for their own unlawful conduct: what they say, sell and design, and what they knowingly help do, under laws that apply to any business.";
const ONE_LINER = "Hold platforms to account for what they do, not for every false thing their users say.";

const CHAIN = [
  { key:"TRIGGER", q:"What triggers platform liability?", p:"P1" },
  { key:"TRUTH", q:"Who determines falsity?", p:"P2" },
  { key:"CONDUCT", q:"What did the platform itself do?", p:"P3" },
  { key:"CONSEQUENCES", q:"What behaviour does the liability rule incentivise?", p:"P4" },
  { key:"ALTERNATIVE", q:"Is that better than a more targeted alternative?", p:"P5" }
];

const TIERS = [
  { t:"1 · Automatic liability", what:"The platform pays whenever a user's post is false and causes harm, whatever it knew.", ex:"“Platforms are responsible for misinformation on their sites.”", stance:"Oppose" },
  { t:"2 · Negligence / notice liability for falsity", what:"Liable if it “should have known” a post was false, or didn't remove it after a flag.", ex:"“Liable if they ignore reports of misinformation.”", stance:"Oppose" },
  { t:"3 · Independent unlawful platform conduct", what:"Liable for the platform's own wrongful acts, judged by laws that apply to any business.", ex:"Defective or addictive design; its own misleading statements; selling ads it knows are fraudulent; knowingly helping a crime; ignoring a court order.", stance:"Support where the law defines the wrong" }
];

const TRIGGER_TEST = [
  "Is the wrong defined without someone first ruling on what's true?",
  "Is it the platform's own act?",
  "Can the platform comply without becoming the referee of disputed facts?"
];

const PEOPLE = {
  P1: {
    link:"TRIGGER", domain:"Frame & trigger", mission:"Set the frame in the first 20 seconds, separate the three kinds of liability, and keep asking what exactly triggers liability.",
    arg:"A1", primary:"Q1", backup:"Q6", backupFor:"P2", vuln:"V1",
    listen:["Duty of care / negligence","Publisher comparisons","“Section 230 is outdated”","Any proposed legal standard"],
    g5:[4,6,11], evidence:["E1","E2","E3","E17","E23"],
    opening:{
      must:[
        "ACKNOWLEDGE: “Let's start with what we agree on. Misinformation can cause real harm, and platforms have enormous influence over what people see.”",
        "CLASH: “Our disagreement isn't about whether the problem matters. It's about whether making a platform legally responsible for determining the truth of what someone else says actually solves it.”",
        "FRAME: “So throughout this debate, we're going to ask one simple question: what exactly triggers liability?”",
        "“There are three possible answers. Automatically, whenever a post is false. When the platform should have known, or was told. Or when the platform itself does something unlawful. We oppose the first two. We accept the third.”"
      ],
      good:["“And the motion says online platforms. That's not just Facebook. It's Reddit, Wikipedia, a local paper's comment section, a hobby forum. Any rule has to work across all of them, or tell us where it stops.”"],
      cut:["The list of platform types."],
      stop:"“So our first question for Group 5: what exactly triggers liability? [P2's name] on who decides what's false.”"
    },
    final:"“Trigger. We asked what makes a platform liable. Every answer we heard still depended on someone deciding a user's post was false.”",
    emergency:"“Which standard? Automatic, after notice, or for the platform's own conduct?”"
  },
  P2: {
    link:"TRUTH", domain:"Truth & knowledge", mission:"Show that any liability for falsity needs someone to decide what's false, fast, before a court looks at it, and that the hard cases are open questions.",
    arg:"A2", primary:"Q2", backup:"Q7", backupFor:"P3", vuln:"V5",
    listen:["Public health claims","Election claims","“It's clearly false”","“They know misinformation is there”","Free speech"],
    g5:[3,13], evidence:["E4","E10","E11","E12"],
    opening:{
      must:[
        "“Any liability for misinformation needs someone to decide what's false, quickly, and usually before a court ever looks at it.”",
        "“Under automatic liability, the platform guesses. Under notice liability, a complaint arrives and the platform has to judge it, with a lawsuit if it guesses wrong.”",
        "“Clearly false content is the easy part. Platforms already remove it. Liability only changes behaviour in the hard cases, where the facts are still open.”"
      ],
      good:["“In 2021 Facebook banned claims that COVID was man-made, then reversed itself within four months as investigations developed. Should it have been liable for the first decision, or the second?”"],
      cut:["The Facebook example, if you are short of time."],
      stop:"“So the second question: who determines falsity? [P3's name] on what the platform actually did.”"
    },
    final:"“Truth. We asked who decides what's false. They never told us who, or how fast, or what happens when the decision is wrong.”",
    emergency:"“Who decides it's false: the platform, a court, or the government?”"
  },
  P3: {
    link:"CONDUCT", domain:"Conduct & design", mission:"Separate what the platform itself does (design, promotion, ads, its own statements) from what users post. Accept liability for conduct; refuse liability triggered by a user's falsehood.",
    arg:"A3", primary:"Q3", backup:"Q8", backupFor:"P4", vuln:"V2",
    listen:["Algorithms and amplification","Profit and engagement","Product liability","Other industries","The 2026 jury verdicts"],
    g5:[1,2,7,12], evidence:["E6","E7","E8","E24","E32"],
    opening:{
      must:[
        "“We agree platforms aren't neutral. They design feeds, sell ads and decide what to promote. When that conduct is unlawful, they should answer for it.”",
        "“Courts are already doing that. Juries this year found against platforms over addictive design, and over a company's own misleading statements about safety. That's liability for what the platform did.”",
        "“The motion asks something different: liability because another person's post is false.”"

 ["ROUND","Opening · Group 6 (5:00)"],

 ["G6·P3","We agree platforms aren't neutral. When their own conduct is unlawful, they should pay, and juries this year did exactly that over addictive design and a company's own misleading statements about safety. The motion asks something different: liability because another person's post is false. If recommendation is the problem, regulate recommendation. [P4] on what this rule would make platforms do."],
 ["G6·P4","If leaving a post up can get you sued and taking it down costs nothing, the rational choice is to remove anything contested. Before 1996, the service that tried to moderate got sued and the one that didn't look was fine. Meta itself estimated one or two in ten removals may already be mistakes. Liability rewards removal, not accuracy. [P5] on whether there's a better way."],
 ["G6·P5","So compare. Speakers can be sued. Platforms can be held liable for their own conduct. Congress has passed narrow takedown laws. And if regulation is needed, process-based duties are a more targeted alternative than liability based on determining whether users' statements are true. Both sides want less misinformation. The question is which rule gets there without making a company the referee of truth."],
 ["ROUND","Opening · Group 5 (5:00)"],
 ["G5·1","A sixteen-year-old watched video after video telling her a supplement would cure her illness. The platform's system kept serving them. She stopped treatment. That isn't an abstract debate about truth."],
 ["G5·2","We're not asking for automatic liability. We propose a duty: once a large platform is credibly notified of content that's demonstrably false and likely to cause serious harm, it must act within a reasonable time, or be liable."],
 ["G5·3","Group 6 say the platform's conduct is fair game. Recommending is conduct. Monetising is conduct. When a platform pushes demonstrably false content to millions and profits from it, liability follows from conduct they already accept."],
 ["G5·4","The law is moving. Two juries found against Meta in March. Europe requires the biggest platforms to manage risks to public health and elections. The US is the outlier."],
 ["G5·5","And voluntary moderation isn't a plan. Meta ended its US fact-checking programme in 2025. Without legal consequences, safety lasts until the next strategy change."],
 ["ROUND","Rebuttal · Group 6 (2:00, order P3 → P4 → P5 → P1 → P2)"],
 ["G6·P3","That story matters, and if a design pushed it, that's conduct, and the verdicts they cite were exactly that: addictive design and Meta's own statements. Neither was about liability for a user's false post. If recommendation is the problem, regulate recommendation."],
 ["G6·P4","Their duty makes leaving a flagged post up costly and taking it down free. Every close call goes to removal. That rewards removal, not accuracy."],
 ["G6·P5","On fact-checking: agreed, voluntary steps can be reversed. If regulation is needed, process-based duties are a more targeted alternative than liability for the truth of users' posts, and that's closer to what Europe actually does."],
 ["G6·P1","Notice the trigger they chose: “demonstrably false”. Demonstrated by whom, before or after removal? That's still a company deciding truth on a complaint."],
 ["G6·P2","And “likely to cause serious harm” was the reason Facebook gave for its COVID-origin ban, which it reversed four months later. Their test would have made it liable either way."],
 ["ROUND","Rebuttal · Group 5 (2:00)"],
 ["G5·2","Group 6 keep asking who decides. Courts decide, after the fact, on a reasonableness standard, exactly as negligence works everywhere else. Platforms can follow expert bodies in the meantime."],
 ["G5·3","And their alternative is slow. A court order arrives after the damage is done. Speed is the whole point in a health crisis or an election."],
 ["G5·5","They've accepted liability for conduct, for court orders and for process duties. We're asking for one more step. That's a difference of degree, not principle."],
 ["ROUND","Final · Group 6 (2:00, order P1 → P5)"],
 ["G6·P1","Trigger. Their final answer is: courts decide later, platforms guess first. So the platform still decides truth, with a lawsuit if it guesses wrong."],
 ["G6·P2","Truth. Following expert bodies is what Facebook did in 2021, before reversing itself. Their rule would have made it liable for both decisions."],
 ["G6·P3","Conduct. Every real wrong they named was the platform's own design or statements. We accept liability there."],
 ["G6·P4","Consequences. “One more step” is the step that makes removing true posts free. That's a difference in principle."],
 ["G6·P5","Alternative. Group 5 proved misinformation can cause harm, which we agreed with in our first sentence. What they needed to prove was when and why another person's false statement should make the platform liable. They didn't show that their rule beats narrower tools. We oppose."],
 ["JUDGE","Close. Group 6 had the clearer principle and better evidence discipline, and the chain made their case easy to follow. Group 5 had the stronger emotional opening and a real point on speed in emergencies, which Group 6 answered only partly. Group 6 also couldn't show that process duties work better in practice. Group 5's “difference of degree” line was effective until Group 6's P4 reframed it. Narrow edge to Group 6 on clash and weighing, but it depends on conceding harm convincingly and keeping evidence modest. Not a default win."]
];

function tag(kind, text){ const m={them:"t-them",us:"t-us",fact:"t-fact",q:"t-q",warn:"t-warn",n:"t-neutral"}; return `<span class="tag ${m[kind]}">${esc(text)}</span>`; }

/* Progressive disclosure card */
let discId = 0;
function discCard(opts){
  const id = "d" + (discId++);
  const parts = [];
  if(opts.why) parts.push(["WHY?", `<div class="blk us"><p>${esc(opts.why)}</p></div>`]);
  if(opts.evidence && opts.evidence.length) parts.push(["EVIDENCE", opts.evidence.map(evLine).join("")]);
  if(opts.counter) parts.push(["THEIR COUNTER", opts.counter.map(c => `<div class="blk them">${tag("them","Group 5")}<p class="say">${esc(c.replace(/^“|”$/g,""))}</p></div>`).join("")]);
  if(opts.response) parts.push(["OUR RESPONSE", opts.response.map(c => `<div class="blk us">${tag("us","Group 6")}<p class="say">${esc(c.replace(/^“|”$/g,""))}</p></div>`).join("")]);
  return `<article class="panel stack" id="${id}">
    <div class="row">${opts.tags||""}</div>
    <h3>${esc(opts.title)}</h3>
    <p class="prose">${esc(opts.claim)}</p>
    <div class="disc-btns">${parts.map((p,i)=>`<button class="btn" type="button" aria-pressed="false" data-disc="${id}" data-part="${i}">${p[0]}</button>`).join("")}</div>
    ${parts.map((p,i)=>`<div class="reveal" data-discbody="${id}-${i}" hidden>${p[1]}</div>`).join("")}
  </article>`;
}

}

function pickDrill(){
  const pool = state.person ? G5.filter(x=>x.owner===state.person) : G5;
  let next; do { next = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && state.drill && next.n===state.drill.n);
  state.drill = next; state.drillStep = 0;
}
function prDrill(){
  if(!state.drill) pickDrill();
  const x = state.drill, s = state.drillStep;
  return `<div class="stack">
    <p class="muted prose">${state.person ? "Drawing from your link's arguments. Switch to Team view for all fifteen." : "Drawing from all fifteen Group 5 arguments."} Answer out loud before revealing. Aim for 30 seconds: Acknowledge → Challenge → Establish → Connect.</p>
    <article class="panel stack">
      <div class="row">${tag("them","They say · #"+x.n)} ${tag("n","Owner "+x.owner)}</div>
      <p style="font-size:19px;line-height:1.45">${esc(x.claim)}</p>
      <div class="row"><button class="btn" type="button" data-quick="30">Start 0:30 think timer</button></div>
      ${s>=1?`<div class="blk us">${tag("us","Best response")}<p class="say">${esc(x.thirty)}</p><p class="small"><b>Question back:</b> ${esc(x.q)}</p></div>`:""}
      ${s>=2?`<div class="blk them">${tag("them","Their counter")}<p class="say">${esc(x.counter)}</p></div>`:""}
      ${s>=3?`<div class="blk us">${tag("us","Our final response")}<p class="say">${esc(x.final)}</p></div>`:""}

        ${s<1?`<button class="btn primary" type="button" data-drill="1">SHOW BEST RESPONSE</button>`:""}

        ${s===2?`<button class="btn primary" type="button" data-drill="3">SHOW OUR FINAL RESPONSE</button>`:""}
        <button class="btn" type="button" data-drill="next">Next argument</button>
      </div>
    </article></div>`;
}

    const who = S.rounds[r]; const len = CONFIG.rounds[r] || 120; const buf = CONFIG.buffer[r] || 10;

    return `<tr><td><b>${r}</b></td><td class="mono">${fmt(len)}</td><td>${who.map(p=>`${p} <span class="muted">(${PEOPLE[p].link})</span>`).join(" → ")}</td><td class="mono">≈${each}s each</td></tr>`;

  const totals = {}; Object.keys(PEOPLE).forEach(p=>totals[p]=0);

  </div>`;
}

   ============================================================ */
const timer = { total: CONFIG.presets[0], remaining: CONFIG.presets[0], running:false, endAt:0, iv:null, sound: LS.get("sound", false), warned:false };
let audioCtx = null;
function beep(freq){ if(!timer.sound) return; try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.15,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4); o.start(); o.stop(audioCtx.currentTime+0.4);}catch(e){} }
function paintTimer(){
  const cls = timer.remaining <= CONFIG.criticalAt ? "crit" : timer.remaining <= CONFIG.warnAt ? "warn" : "";
  document.querySelectorAll(".js-timer").forEach(el=>{ el.textContent = fmt(timer.remaining); el.classList.toggle("warn", cls==="warn"); el.classList.toggle("crit", cls==="crit"); });
}
function tick(){
  timer.remaining = Math.max(0, (timer.endAt - Date.now())/1000);
  if(!timer.warned && timer.remaining <= CONFIG.warnAt && timer.total > CONFIG.warnAt){ timer.warned = true; beep(660); }
  if(timer.remaining <= 0){ timerPause(); timer.remaining = 0; beep(440); setTimeout(()=>beep(440),450); }
  paintTimer();
}
function timerStart(){ if(timer.running || timer.remaining<=0) return; timer.running=true; timer.endAt = Date.now() + timer.remaining*1000; timer.iv = setInterval(tick, 200); try{ audioCtx && audioCtx.resume(); }catch(e){} }
function timerPause(){ timer.running=false; clearInterval(timer.iv); timer.iv=null; }
function timerReset(){ timerPause(); timer.remaining = timer.total; timer.warned=false; paintTimer(); }
function timerSet(s){ timerPause(); timer.total = s; timer.remaining = s; timer.warned=false; paintTimer(); }

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render(){
  discId = 0;
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.mode===state.mode)));
  document.getElementById("roleChip").textContent = state.person ? state.person + " · " + PEOPLE[state.person].link : "TEAM VIEW";
  app.innerHTML = state.mode==="learn" ? viewLearn() : state.mode==="practise" ? viewPractise() : state.mode==="live" ? viewLive() : viewHome();
  paintTimer();
  const bar = document.getElementById("bar"); document.documentElement.style.setProperty("--barh", bar.offsetHeight + "px");
  save();
}

function go(mode){ state.mode = mode; render(); window.scrollTo(0,0); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button, [data-golive]"); if(!t) return;
  const d = t.dataset;
  if(t.id==="homeBtn") return go("home");
  if(t.id==="roleChip") return go("home");
  if(t.id==="timerPill"){ timer.running ? timerPause() : timerStart(); return; }
  if(t.id==="emergBtn" || d.emergency==="1"){ renderEmergency(); document.getElementById("emergency").hidden=false; return; }
  if(d.emergency==="0"){ document.getElementById("emergency").hidden=true; return; }
  if(d.mode) return go(d.mode);
  if(d.person !== undefined){ state.person = d.person || null; if(state.person){ state.learnTab="brief"; } else if(state.learnTab==="brief"){ state.learnTab="position"; } state.drill=null; qtrainerId=null; if(state.mode==="home"){ state.mode="learn"; } render(); window.scrollTo(0,0); return; }
  if(d.golive){ state.liveLink = d.golive; return go("live"); }
  if(d.learn){ state.learnTab = d.learn; render(); return; }
  if(d.practise){ state.practiseTab = d.practise; render(); return; }
  if(d.disc){ const body = document.querySelector(`[data-discbody="${d.disc}-${d.part}"]`); const open = body.hidden; body.hidden = !open; t.setAttribute("aria-pressed", String(open)); return; }
  if(d.branch){ const card = t.closest("[data-q]"); const q = qById(card.dataset.q); card.querySelectorAll("[data-branch]").forEach(b=>b.setAttribute("aria-pressed", String(b===t))); const out = card.querySelector("[data-branchout]"); out.hidden=false; out.querySelector("[data-branchtext]").textContent = q[d.branch]; return; }
  if(d.drill){ if(d.drill==="next"){ pickDrill(); } else { state.drillStep = Number(d.drill); } render(); return; }
  if(d.quick){ timerSet(Number(d.quick)); timerStart(); return; }
  if(d.qpick){ const pool = state.person ? QUESTIONS.filter(q=>q.owner===state.person) : QUESTIONS; qtrainerId = d.qpick==="random" ? pool[Math.floor(Math.random()*pool.length)].id : d.qpick; render(); return; }
  if(d.preset){ timerSet(Number(d.preset)); return; }
  if(d.timer){ ({start:timerStart, pause:timerPause, reset:timerReset})[d.timer](); return; }
  if(d.structure){ state.structure = d.structure; render(); return; }
  if(d.link){ state.liveLink = state.liveLink===d.link ? null : d.link; render(); return; }
  if(d.topic !== undefined){ const i = Number(d.topic); state.liveTopic = state.liveTopic===i ? null : i; render(); return; }
  if(d.evtype !== undefined){ document.querySelectorAll("[data-evtype]").forEach(b=>b.setAttribute("aria-pressed", String(b===t))); document.querySelectorAll("#evList [data-type]").forEach(c=>{ c.hidden = !!d.evtype && c.dataset.type!==d.evtype; }); return; }
  if(t.id==="clearNotes"){ document.getElementById("clearConfirm").hidden=false; return; }
  if(t.id==="clearNo"){ document.getElementById("clearConfirm").hidden=true; return; }
  if(t.id==="clearYes"){ LS.set("notes", {}); render(); return; }
});

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.note){ const [p,f] = t.dataset.note.split("|"); const notes = LS.get("notes", {}); notes[p] = notes[p]||{}; notes[p][f] = t.value; LS.set("notes", notes); }
  if(t.dataset.score){ const s = LS.get("scores", {}); s[t.dataset.score] = Number(t.value); LS.set("scores", s); const total = RUBRIC.reduce((a,r)=>a + (s[r[0]]||3)/5*r[1], 0); const el = document.getElementById("scoreTotal"); if(el) el.textContent = total.toFixed(0) + " / 100"; }
  if(t.id==="fwSearch" || t.id==="fwOwner") filterPlaybook();
});
document.addEventListener("change", e=>{
  if(e.target.id==="soundToggle"){ timer.sound = e.target.checked; LS.set("sound", timer.sound); if(timer.sound) beep(880); }
  if(e.target.id==="fwOwner") filterPlaybook();
});
function filterPlaybook(){
  const q = (document.getElementById("fwSearch").value||"").toLowerCase(), o = document.getElementById("fwOwner").value;
  const items = G5.filter(x => (!o || x.owner===o) && (!q || [x.title,x.claim,x.ten,x.thirty,x.q].join(" ").toLowerCase().includes(q)));
  document.getElementById("fwList").innerHTML = items.length ? items.map(g5Card).join("") : `<p class="muted">No Group 5 argument matches “${esc(q)}”. Try “Other” in LIVE mode.</p>`;
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.getElementById("emergency").hidden=true; } });
window.addEventListener("resize", ()=>{ const bar=document.getElementById("bar"); document.documentElement.style.setProperty("--barh", bar.offsetHeight+"px"); });

render();
</script>
</body>
